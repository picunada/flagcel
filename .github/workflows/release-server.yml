name: Release Server

# Builds and publishes the Flagcel server on a bare `v*` tag (sub-modules use
# prefixed tags, so `v*` is the server release):
#   - cross-compiled binaries + checksums on a GitHub Release
#   - multi-arch images on GHCR (ghcr.io/picunada/flagcel) and Docker Hub
#     (docker.io/picunada/flagcel)
#
# Required repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
# GHCR uses the built-in GITHUB_TOKEN.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release
  packages: write # push images to GHCR
  id-token: write # provenance / future signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # Generates internal/store/postgres/sqlcgen (gitignored) via the GoReleaser
      # `sqlc generate` before hook.
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # The GoReleaser `before` hook runs `make web`, which needs deps installed.
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
