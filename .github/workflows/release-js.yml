name: Release JS SDK

# Publishes @flagcel/openfeature-server to npm.
# Trigger: push a tag like `js-v0.1.0` (must match sdks/js/package.json version).
on:
  push:
    tags:
      - "js-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance + trusted publishing
    defaults:
      run:
        working-directory: sdks/js
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: sdks/js/pnpm-lock.yaml

      # Trusted publishing requires a recent npm.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

      # Fail early if the tag version does not match package.json.
      - name: Verify tag matches package version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#js-v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag js-v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # Uses npm trusted publishing (OIDC) — no NPM_TOKEN needed once the
      # trusted publisher is configured at npmjs.com for this repo+workflow.
      - run: npm publish --provenance --access public
