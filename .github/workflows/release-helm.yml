name: Release Helm Chart

# Publishes the Flagcel Helm chart as an OCI artifact to GHCR.
# Trigger: push a tag like `charts/v0.1.0` (must match charts/flagcel/Chart.yaml version).
# Pull with: helm pull oci://ghcr.io/picunada/charts/flagcel --version 0.1.0
on:
  push:
    tags:
      - "charts/v*"

permissions:
  contents: read
  packages: write # push the chart to GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Verify tag matches chart version
        run: |
          CHART_VER=$(helm show chart charts/flagcel | awk '/^version:/ {print $2}')
          TAG="${GITHUB_REF_NAME##*/}"; TAG="${TAG#v}"
          if [ "$CHART_VER" != "$TAG" ]; then
            echo "::error::tag charts/v$TAG does not match Chart.yaml version $CHART_VER"
            exit 1
          fi

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Lint
        run: helm lint charts/flagcel

      - name: Package
        run: |
          helm dependency update charts/flagcel
          helm package charts/flagcel --destination dist

      - name: Push
        run: helm push dist/flagcel-*.tgz oci://ghcr.io/picunada/charts
