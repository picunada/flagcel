name: Release Python SDK

# Publishes flagcel-openfeature to PyPI via trusted publishing (OIDC).
# Trigger: push a tag like `py-v0.1.0` (must match sdks/python/pyproject.toml version).
on:
  push:
    tags:
      - "py-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches project version
        run: |
          VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#py-v}"
          if [ "$VER" != "$TAG" ]; then
            echo "::error::tag py-v$TAG does not match pyproject version $VER"
            exit 1
          fi

      - run: python -m pip install --upgrade build
      - run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sdks/python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # No token needed once the trusted publisher is configured at pypi.org.
      - uses: pypa/gh-action-pypi-publish@release/v1
