[project]
name = "flagcel-openfeature"
version = "0.0.0"
description = "OpenFeature provider for Flagcel with local CEL evaluation"
requires-python = ">=3.11"
dependencies = [
  "cel-expr-python>=0.1.2,<0.2",
  "openfeature-sdk>=0.9,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[tool.setuptools]
packages = ["flagcel_openfeature"]
