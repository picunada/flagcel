openapi: 3.0.3
info:
  title: Flagcel API
  description: Feature flag service with CEL-based targeting rules.
  version: "1.0.0"
servers:
  - url: http://localhost:8080/api/v1
    description: Local dev

tags:
  - name: Health
  - name: Auth
  - name: Environments
  - name: Flags
  - name: Rules
  - name: Contexts
  - name: Evaluation
  - name: Usage
  - name: API Keys

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Check application health
      description: Returns a successful response when the HTTP application is running.
      responses:
        "200":
          description: Application is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"

  /readyz:
    get:
      tags: [Health]
      summary: Check application readiness
      description: Returns a successful response when the HTTP application can reach its datastore.
      responses:
        "200":
          description: Application is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "503":
          description: Application is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: NOT_READY
                  message: Service is not ready

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current admin session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current auth state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /flags:
    get:
      tags: [Flags]
      summary: List flags
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Flags list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagListEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Flags]
      summary: Create or replace a flag
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFlagRequest"
      responses:
        "200":
          description: Flag created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/InvalidRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /flags/{key}:
    parameters:
      - $ref: "#/components/parameters/FlagKey"
    get:
      tags: [Flags]
      summary: Get a flag by key
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/FlagNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Flags]
      summary: Delete a flag and all of its rules
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Flag deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /flags/{key}/audit:
    parameters:
      - $ref: "#/components/parameters/FlagKey"
    get:
      tags: [Flags]
      summary: Get a flag's change history
      description: >-
        Returns the flag's version timeline (newest first). Each entry is a full
        snapshot of the flag config after the change, so consecutive entries can
        be diffed to show exactly what changed and by whom.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Flag change history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntryListEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /environments:
    get:
      tags: [Environments]
      summary: List environments
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Environments list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentListEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Environments]
      summary: Create an environment
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvironmentRequest"
      responses:
        "200":
          description: Environment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/EnvironmentKeyTaken" }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /environments/{environment_id}:
    parameters:
      - $ref: "#/components/parameters/EnvironmentID"
    get:
      tags: [Environments]
      summary: Get an environment
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/EnvironmentNotFound" }
    put:
      tags: [Environments]
      summary: Update an environment
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvironmentRequest"
      responses:
        "200":
          description: Environment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/EnvironmentNotFound" }
        "409": { $ref: "#/components/responses/EnvironmentKeyTaken" }
    delete:
      tags: [Environments]
      summary: Delete an environment
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Environment deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/EnvironmentNotFound" }
        "409": { $ref: "#/components/responses/EnvironmentInUse" }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /environments/{environment_id}/flags:
    parameters:
      - $ref: "#/components/parameters/EnvironmentID"
    get:
      tags: [Flags]
      summary: List flags in an environment
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Flags list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagListEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/EnvironmentNotFound" }
    post:
      tags: [Flags]
      summary: Create or replace a flag in an environment
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFlagRequest"
      responses:
        "200":
          description: Flag created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/EnvironmentNotFound" }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /environments/{environment_id}/flags/{key}:
    parameters:
      - $ref: "#/components/parameters/EnvironmentID"
      - $ref: "#/components/parameters/FlagKey"
    get:
      tags: [Flags]
      summary: Get a flag by key in an environment
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/FlagNotFound" }
    delete:
      tags: [Flags]
      summary: Delete a flag and all of its rules in an environment
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Flag deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/FlagNotFound" }

  /environments/{environment_id}/flags/{key}/audit:
    parameters:
      - $ref: "#/components/parameters/EnvironmentID"
      - $ref: "#/components/parameters/FlagKey"
    get:
      tags: [Flags]
      summary: Get a flag's change history in an environment
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Flag change history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntryListEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /environments/{environment_id}/usage:
    parameters:
      - $ref: "#/components/parameters/EnvironmentID"
      - $ref: "#/components/parameters/UsageHours"
    get:
      tags: [Usage]
      summary: Get usage analytics for all flags in an environment
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Environment usage analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagUsageEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/EnvironmentNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /environments/{environment_id}/flags/{key}/usage:
    parameters:
      - $ref: "#/components/parameters/EnvironmentID"
      - $ref: "#/components/parameters/FlagKey"
      - $ref: "#/components/parameters/UsageHours"
    get:
      tags: [Usage]
      summary: Get usage analytics for one flag
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Flag usage analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagUsageEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/FlagNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /environments/{environment_id}/flags/{key}/evaluate:
    parameters:
      - $ref: "#/components/parameters/EnvironmentID"
      - $ref: "#/components/parameters/FlagKey"
    post:
      tags: [Flags]
      summary: Evaluate one flag with diagnostic trace
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvalRequest"
      responses:
        "200":
          description: Evaluation trace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalTraceEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/FlagNotFound" }
        "422": { $ref: "#/components/responses/InvalidRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /environments/{environment_id}/flags/{key}/rules:
    parameters:
      - $ref: "#/components/parameters/EnvironmentID"
      - $ref: "#/components/parameters/FlagKey"
    get:
      tags: [Rules]
      summary: List rules for a flag in an environment
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Rules list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleListEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/FlagNotFound" }
    post:
      tags: [Rules]
      summary: Create a rule in an environment
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRuleRequest"
      responses:
        "200":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /environments/{environment_id}/flags/{key}/rules/reorder:
    parameters:
      - $ref: "#/components/parameters/EnvironmentID"
      - $ref: "#/components/parameters/FlagKey"
    post:
      tags: [Rules]
      summary: Reorder rules in an environment
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRulesRequest"
      responses:
        "204":
          description: Rules reordered
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/RuleNotFound" }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /environments/{environment_id}/flags/{key}/rules/{id}:
    parameters:
      - $ref: "#/components/parameters/EnvironmentID"
      - $ref: "#/components/parameters/FlagKey"
      - $ref: "#/components/parameters/RuleID"
    get:
      tags: [Rules]
      summary: Get a rule in an environment
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/RuleNotFound" }
    put:
      tags: [Rules]
      summary: Update a rule in an environment
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRuleRequest"
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/RuleNotFound" }
        "422": { $ref: "#/components/responses/InvalidRequest" }
    delete:
      tags: [Rules]
      summary: Delete a rule in an environment
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Rule deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/RuleNotFound" }

  /flags/{key}/rules:
    parameters:
      - $ref: "#/components/parameters/FlagKey"
    get:
      tags: [Rules]
      summary: List rules for a flag
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Rules list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleListEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/FlagNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Rules]
      summary: Create a rule
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRuleRequest"
      responses:
        "200":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/InvalidRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /flags/{key}/rules/reorder:
    parameters:
      - $ref: "#/components/parameters/FlagKey"
    post:
      tags: [Rules]
      summary: Reorder rules
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRulesRequest"
      responses:
        "204":
          description: Rules reordered
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/RuleNotFound" }
        "422": { $ref: "#/components/responses/InvalidRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /flags/{key}/rules/{id}:
    parameters:
      - $ref: "#/components/parameters/FlagKey"
      - $ref: "#/components/parameters/RuleID"
    get:
      tags: [Rules]
      summary: Get a rule
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/RuleNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Rules]
      summary: Update a rule
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRuleRequest"
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/RuleNotFound" }
        "422": { $ref: "#/components/responses/InvalidRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Rules]
      summary: Delete a rule
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Rule deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/RuleNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /contexts:
    get:
      tags: [Contexts]
      summary: List context schemas
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Context list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextListEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Contexts]
      summary: Create a context schema
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContextRequest"
      responses:
        "200":
          description: Context created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /contexts/{id}:
    parameters:
      - $ref: "#/components/parameters/ContextID"
    get:
      tags: [Contexts]
      summary: Get a context schema
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ContextNotFound" }
    put:
      tags: [Contexts]
      summary: Update a context schema
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContextRequest"
      responses:
        "200":
          description: Context updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ContextNotFound" }
    delete:
      tags: [Contexts]
      summary: Delete a context schema
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Context deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ContextNotFound" }

  /eval:
    post:
      tags: [Evaluation]
      summary: Evaluate all flags
      security:
        - bearerAPIKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvalRequest"
      responses:
        "200":
          description: Evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalAllEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /eval/definitions:
    get:
      tags: [Evaluation]
      summary: Get raw flag definitions for SDK polling
      security:
        - bearerAPIKey: []
      parameters:
        - in: header
          name: If-None-Match
          schema:
            type: string
          description: Previous ETag returned by this endpoint.
      responses:
        "200":
          description: Flag definitions and referenced context schemas
          headers:
            ETag:
              schema:
                type: string
              description: Current in-memory definitions version.
            Cache-Control:
              schema:
                type: string
              description: Cache validator policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalDefinitionsEnvelope"
        "304":
          description: Definitions have not changed since the supplied ETag
          headers:
            ETag:
              schema:
                type: string
        "401": { $ref: "#/components/responses/Unauthorized" }

  /eval/{key}:
    parameters:
      - $ref: "#/components/parameters/FlagKey"
    post:
      tags: [Evaluation]
      summary: Evaluate one flag
      security:
        - bearerAPIKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvalRequest"
      responses:
        "200":
          description: Evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/FlagNotFound" }

  /api-keys:
    get:
      tags: [API Keys]
      summary: List evaluation API keys
      security:
        - sessionCookie: []
      responses:
        "200":
          description: API keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyListEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [API Keys]
      summary: Create an evaluation API key
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
      responses:
        "200":
          description: API key created; token is returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAPIKeyEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/InvalidRequest" }

  /api-keys/{id}:
    parameters:
      - $ref: "#/components/parameters/APIKeyID"
    delete:
      tags: [API Keys]
      summary: Revoke an evaluation API key
      security:
        - sessionCookie: []
      responses:
        "204":
          description: API key revoked
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/APIKeyNotFound" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: flagcel_session
    bearerAPIKey:
      type: http
      scheme: bearer

  parameters:
    EnvironmentID:
      name: environment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FlagKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        example: new-checkout
    RuleID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContextID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    APIKeyID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UsageHours:
      name: hours
      in: query
      required: false
      schema:
        type: integer
        enum: [24, 168, 720]
        default: 24
      description: Usage lookback window in hours.

  schemas:
    SuccessEnvelope:
      type: object
      required: [message, data]
      properties:
        message:
          type: string
          example: success
        data: {}

    User:
      type: object
      required: [id, email, admin, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        description: { type: string }
        admin: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid, nullable: true }
        deleted_by: { type: string, format: uuid, nullable: true }

    AuthMe:
      type: object
      required: [auth_enabled, authenticated]
      properties:
        auth_enabled: { type: boolean }
        mode:
          type: string
          enum: [oidc, password]
        authenticated: { type: boolean }
        user:
          $ref: "#/components/schemas/User"

    AuthMeEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AuthMe"

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    HealthEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Health"

    Environment:
      type: object
      required: [id, key, name, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: production }
        name: { type: string, example: Production }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid, nullable: true }
        deleted_by: { type: string, format: uuid, nullable: true }

    CreateEnvironmentRequest:
      type: object
      required: [key]
      properties:
        key: { type: string, example: staging }
        name: { type: string, example: Staging }
        description: { type: string }

    Rollout:
      type: object
      required: [percentage]
      properties:
        percentage:
          type: integer
          minimum: 0
          maximum: 100
          example: 25
        bucket_by:
          type: string
          example: user.id

    Rule:
      type: object
      required: [id, expression, rollout, value, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        description: { type: string }
        expression:
          type: string
          example: "user.country == 'US'"
        rollout:
          $ref: "#/components/schemas/Rollout"
        value:
          $ref: "#/components/schemas/FlagValue"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid, nullable: true }
        updated_by: { type: string, format: uuid, nullable: true }
        deleted_by: { type: string, format: uuid, nullable: true }

    Flag:
      type: object
      required: [key, type, enabled, rules, default_value, created_at, updated_at]
      properties:
        key: { type: string, example: new-checkout }
        description: { type: string }
        type:
          type: string
          enum: [boolean, string, number, json]
        enabled: { type: boolean }
        rules:
          type: array
          items:
            $ref: "#/components/schemas/Rule"
        default_value:
          $ref: "#/components/schemas/FlagValue"
        context_id:
          type: string
          format: uuid
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid, nullable: true }
        updated_by: { type: string, format: uuid, nullable: true }
        deleted_by: { type: string, format: uuid, nullable: true }

    AuditEntry:
      type: object
      required: [version, action, created_at]
      properties:
        version: { type: integer, example: 3 }
        action:
          type: string
          enum: [created, updated, deleted]
        actor_label:
          type: string
          nullable: true
          description: Human-readable actor (e.g. email) captured when the change was made.
        snapshot:
          allOf:
            - $ref: "#/components/schemas/Flag"
          nullable: true
          description: Full flag config after the change; null for a deletion.
        created_at: { type: string, format: date-time }

    CreateFlagRequest:
      type: object
      required: [key]
      properties:
        key: { type: string }
        description: { type: string }
        type:
          type: string
          enum: [boolean, string, number, json]
          default: boolean
        enabled: { type: boolean, default: false }
        rules:
          type: array
          items:
            $ref: "#/components/schemas/CreateRuleRequest"
          default: []
        default_value:
          allOf:
            - $ref: "#/components/schemas/FlagValue"
          default: false
        context_id:
          type: string
          format: uuid
          nullable: true

    CreateRuleRequest:
      type: object
      required: [expression, rollout]
      properties:
        description: { type: string }
        expression: { type: string }
        rollout:
          $ref: "#/components/schemas/Rollout"
        value:
          allOf:
            - $ref: "#/components/schemas/FlagValue"
          default: true

    UpdateRuleRequest:
      $ref: "#/components/schemas/CreateRuleRequest"

    ReorderRulesRequest:
      type: object
      required: [rule_ids]
      properties:
        rule_ids:
          type: array
          items:
            type: string
            format: uuid

    ContextField:
      type: object
      required: [path, type]
      properties:
        path: { type: string, example: user.country }
        type:
          type: string
          enum: [string, int, double, bool, timestamp, list, map]

    Context:
      type: object
      required: [id, name, fields, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ContextField"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid, nullable: true }
        deleted_by: { type: string, format: uuid, nullable: true }

    CreateContextRequest:
      type: object
      required: [name, fields]
      properties:
        name: { type: string }
        description: { type: string }
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ContextField"

    EvalRequest:
      type: object
      required: [context]
      properties:
        context:
          type: object
          additionalProperties: true

    FlagUsage:
      type: object
      required: [buckets, latency_buckets, events]
      properties:
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/FlagUsageBucket"
        latency_buckets:
          type: array
          items:
            $ref: "#/components/schemas/FlagUsageLatencyBucket"
        events:
          type: array
          items:
            $ref: "#/components/schemas/FlagUsageEvent"

    FlagUsageBucket:
      type: object
      required: [bucket_start, value_type, value, reason, count]
      properties:
        bucket_start: { type: string, format: date-time }
        flag_key: { type: string }
        value_type:
          type: string
          enum: [boolean, string, number, json]
        value:
          $ref: "#/components/schemas/FlagValue"
        reason: { type: string }
        matched_rule_id: { type: string, format: uuid, nullable: true }
        api_key_id: { type: string, format: uuid, nullable: true }
        api_key_name: { type: string }
        source: { type: string }
        count: { type: integer, format: int64, minimum: 0 }

    FlagUsageLatencyBucket:
      type: object
      required: [bucket_start, count, avg_latency_ms, p95_latency_ms]
      properties:
        bucket_start: { type: string, format: date-time }
        flag_key: { type: string }
        source: { type: string }
        count: { type: integer, format: int64, minimum: 0 }
        avg_latency_ms: { type: number, format: double }
        p95_latency_ms: { type: number, format: double }

    FlagUsageEvent:
      type: object
      required: [id, observed_at, value_type, value, reason, latency_ms]
      properties:
        id: { type: string, format: uuid }
        observed_at: { type: string, format: date-time }
        value_type:
          type: string
          enum: [boolean, string, number, json]
        value:
          $ref: "#/components/schemas/FlagValue"
        reason: { type: string }
        matched_rule_id: { type: string, format: uuid, nullable: true }
        api_key_id: { type: string, format: uuid, nullable: true }
        source: { type: string }
        latency_ms: { type: number, format: double }
        context:
          type: object
          additionalProperties: true

    EvalResponse:
      type: object
      required: [key, value_type, value]
      properties:
        key: { type: string }
        value_type:
          type: string
          enum: [boolean, string, number, json]
        value:
          $ref: "#/components/schemas/FlagValue"

    EvalMatchedRule:
      type: object
      required: [id, index, expression, value]
      properties:
        id: { type: string, format: uuid }
        index: { type: integer, minimum: 0 }
        expression: { type: string }
        value:
          $ref: "#/components/schemas/FlagValue"

    EvalRuleResult:
      type: object
      required: [id, index, expression, value, matched]
      properties:
        id: { type: string, format: uuid }
        index: { type: integer, minimum: 0 }
        expression: { type: string }
        value:
          $ref: "#/components/schemas/FlagValue"
        matched: { type: boolean }
        error: { type: string }

    EvalBucket:
      type: object
      required: [bucket_by, percentage, in_rollout, missing]
      properties:
        bucket_by: { type: string }
        bucket_value: { type: string }
        bucket_number: { type: integer, minimum: 0, maximum: 99 }
        percentage: { type: integer, minimum: 0, maximum: 100 }
        in_rollout: { type: boolean }
        missing: { type: boolean }

    EvalTraceResponse:
      type: object
      required: [key, value_type, enabled, default_value, value, reason, rule_results]
      properties:
        key: { type: string }
        value_type:
          type: string
          enum: [boolean, string, number, json]
        enabled: { type: boolean }
        default_value:
          $ref: "#/components/schemas/FlagValue"
        value:
          $ref: "#/components/schemas/FlagValue"
        reason:
          type: string
          enum: [disabled, matched_rule, default_no_match, cel_error]
        error: { type: string }
        matched_rule:
          $ref: "#/components/schemas/EvalMatchedRule"
        bucket:
          $ref: "#/components/schemas/EvalBucket"
        rule_results:
          type: array
          items:
            $ref: "#/components/schemas/EvalRuleResult"

    EvalAllResponse:
      type: object
      required: [flags]
      properties:
        flags:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/EvalFlagValue"

    EvalDefinitions:
      type: object
      required: [flags]
      properties:
        flags:
          type: array
          items:
            $ref: "#/components/schemas/FlagDefinition"
        contexts:
          type: array
          items:
            $ref: "#/components/schemas/Context"

    FlagDefinition:
      allOf:
        - $ref: "#/components/schemas/Flag"
        - type: object
          properties:
            context_schema:
              $ref: "#/components/schemas/Context"

    EvalFlagValue:
      type: object
      required: [value_type, value]
      properties:
        value_type:
          type: string
          enum: [boolean, string, number, json]
        value:
          $ref: "#/components/schemas/FlagValue"

    FlagValue:
      nullable: true
      oneOf:
        - type: boolean
        - type: string
        - type: number
        - type: object
          additionalProperties: true
        - type: array
          items: {}

    APIKey:
      type: object
      required: [id, name, prefix, environment_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        prefix: { type: string, example: fc_vT4... }
        environment_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_by: { type: string, format: uuid, nullable: true }
        deleted_by: { type: string, format: uuid, nullable: true }

    CreateAPIKeyRequest:
      type: object
      required: [name, environment_id]
      properties:
        name: { type: string }
        description: { type: string }
        environment_id: { type: string, format: uuid }

    CreatedAPIKey:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Raw bearer token. It is returned once.

    FlagEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Flag"
    FlagListEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Flag"
    AuditEntryListEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/AuditEntry"
    FlagUsageEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/FlagUsage"
    EnvironmentEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Environment"
    EnvironmentListEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Environment"
    RuleEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Rule"
    RuleListEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Rule"
    ContextEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Context"
    ContextListEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Context"
    EvalEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/EvalResponse"
    EvalTraceEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/EvalTraceResponse"
    EvalAllEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/EvalAllResponse"
    EvalDefinitionsEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/EvalDefinitions"
    APIKeyListEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/APIKey"
    CreateAPIKeyEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CreatedAPIKey"

    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - FLAG_NOT_FOUND
            - RULE_NOT_FOUND
            - ENVIRONMENT_NOT_FOUND
            - ENVIRONMENT_KEY_TAKEN
            - ENVIRONMENT_IN_USE
            - DEFAULT_ENVIRONMENT
            - CONTEXT_NOT_FOUND
            - CONTEXT_NAME_TAKEN
            - API_KEY_NOT_FOUND
            - INVALID_REQUEST
            - BAD_REQUEST
            - AUTH_NOT_CONFIGURED
            - NOT_READY
            - INVALID_CREDENTIALS
            - UNAUTHORIZED
            - FORBIDDEN
            - INTERNAL_ERROR
        message:
          type: string

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/APIError"

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication required
    FlagNotFound:
      description: Flag not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RuleNotFound:
      description: Rule not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    EnvironmentNotFound:
      description: Environment not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    EnvironmentKeyTaken:
      description: Environment key already in use
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    EnvironmentInUse:
      description: Environment is referenced by flags or API keys
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ContextNotFound:
      description: Context not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    APIKeyNotFound:
      description: API key not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvalidRequest:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
