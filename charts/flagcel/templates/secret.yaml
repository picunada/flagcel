{{- /*
Chart-managed Secret for sensitive config that isn't supplied via an existing
Secret. Keys are included conditionally; reference them from the Deployment.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flagcel.fullname" . }}
  labels:
    {{- include "flagcel.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.database.existingSecret }}
  DATABASE_URL: {{ include "flagcel.databaseUrl" . | quote }}
  {{- end }}
  {{- if not .Values.auth.existingSecret }}
  AUTH_SESSION_SECRET: {{ include "flagcel.sessionSecret" . | quote }}
  {{- end }}
  {{- if .Values.auth.bootstrapAdminPassword }}
  AUTH_BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.auth.bootstrapAdminPassword | quote }}
  {{- end }}
  {{- if .Values.auth.oidc.clientSecret }}
  AUTH_OIDC_CLIENT_SECRET: {{ .Values.auth.oidc.clientSecret | quote }}
  {{- end }}
